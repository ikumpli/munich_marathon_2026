name: Build and deploy dashboard to GitHub Pages

on:
  schedule:
    - cron: '0 6 * * *'   # every day at 06:00 UTC — auto-sync & rebuild
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync activities from Intervals.icu
        env:
          INTERVALS_ICU_API_KEY: ${{ secrets.INTERVALS_ICU_API_KEY }}
        run: python scripts/sync_data.py

      - name: Adjust training plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/adjust_plan.py

      - name: Generate dashboard
        run: |
          python scripts/generate_dashboard.py

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html i600311_activities.csv plan.json
          git diff --cached --quiet || git commit -m "chore: sync data + regenerate dashboard [skip ci]"
          git push
